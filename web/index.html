<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coordinate Studio</title>
  <meta name="description" content="Interactive 2D and 3D coordinate system: plot equations, points and vectors.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap">
  <script defer src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@4.1.1/plotly.min.js"></script>
  <style>
    :root {
      --bg: #0b1020; --panel: rgba(15, 23, 42, .78); --panel-solid: #0f172a; --border: #1f2937;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --accent2: #c084fc; --accent3: #f472b6;
      --ok: #22c55e; --err: #f87171; --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Inter, "Segoe UI", system-ui, sans-serif; color: var(--text); min-height: 100vh;
      background: radial-gradient(circle at 15% 0%, #1e1b4b 0%, var(--bg) 45%, #050814 100%) fixed var(--bg);
    }
    code, textarea { font-family: "JetBrains Mono", Consolas, monospace; }
    code { background: #111827; color: #a3e635; padding: 1px 6px; border-radius: 6px; font-size: .85em; }
    .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
    aside {
      background: linear-gradient(180deg, #111827 0%, var(--bg) 100%); border-right: 1px solid var(--border);
      padding: 24px 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    main { padding: 28px clamp(16px, 3vw, 44px) 60px; min-width: 0; }
    h3 { margin: 22px 0 10px; font-size: 1.05rem; }
    aside h3:first-child { margin-top: 0; }
    label.field { display: block; font-size: .85rem; color: #cbd5e1; margin: 14px 0 6px; }
    label.field output { float: right; color: var(--accent); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .segmented { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-solid); border: 1px solid var(--border);
      border-radius: 12px; padding: 4px; gap: 4px; }
    .segmented button { border: 0; border-radius: 9px; padding: 9px 6px; background: transparent; color: var(--muted);
      font: inherit; font-weight: 600; cursor: pointer; }
    .segmented button[aria-pressed=true] { background: linear-gradient(135deg, #0ea5e9, #8b5cf6); color: white; }
    .toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: .9rem; cursor: pointer; }
    .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
    .btn { width: 100%; font: inherit; color: var(--text); background: var(--panel-solid); border: 1px solid #334155;
      border-radius: 10px; padding: 9px 10px; }
    .btn { margin-top: 8px; cursor: pointer; font-weight: 600; }
    .btn:hover { border-color: var(--accent); }
    .hero { padding: 20px 26px; border-radius: 18px; margin-bottom: 18px;
      background: linear-gradient(135deg, rgba(56,189,248,.18), rgba(192,132,252,.18));
      border: 1px solid rgba(148,163,184,.25); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
    .hero h1 { margin: 0; font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.3rem); }
    .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { margin: 6px 0 0; color: #cbd5e1; line-height: 1.6; }
    .input-label { font-size: .85rem; color: #cbd5e1; display: flex; justify-content: space-between; margin-bottom: 6px; }
    textarea { width: 100%; min-height: 130px; resize: vertical; font-size: 1.05rem; line-height: 1.5; color: var(--text);
      background: var(--panel-solid); border: 1px solid #334155; border-radius: 12px; padding: 12px 14px; }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .messages { margin: 10px 0; display: grid; gap: 8px; }
    .msg { border-radius: 10px; padding: 10px 14px; font-size: .92rem; }
    .msg.error { background: rgba(248,113,113,.12); color: #fca5a5; border: 1px solid rgba(248,113,113,.35); }
    .msg.warning { background: rgba(251,191,36,.10); color: #fde68a; border: 1px solid rgba(251,191,36,.3); }
    .content { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr); gap: 28px; align-items: start; }
    #plot { width: 100%; height: 700px; border-radius: 14px; overflow: hidden; background: var(--bg); }
    .hint { color: var(--muted); font-size: .82rem; margin-top: 8px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
    .card h4 { margin: 0 0 10px; font-size: 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .chip { padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 600; color: var(--bg); }
    .sentence { margin: 6px 0; line-height: 1.6; color: #e2e8f0; }
    .empty { color: var(--muted); background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.25);
      border-radius: 10px; padding: 10px 14px; }
    .status { font-size: .8rem; color: var(--muted); min-height: 1em; }
    .menu { display: none; }
    @media (max-width: 1100px) { .content { grid-template-columns: 1fr; } }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 16px; }
      aside .collapsible { display: none; }
      aside.open .collapsible { display: block; }
      .menu { display: block; }
      #plot { height: 480px; }
      main { padding: 16px 16px 48px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside id="sidebar">
    <h3>⚙️ View</h3>
    <div class="segmented" role="group" aria-label="Coordinate system">
      <button type="button" data-mode="3d" aria-pressed="true">3D Space</button>
      <button type="button" data-mode="2d" aria-pressed="false">2D Plane</button>
    </div>
    <button type="button" class="btn menu" id="menu" aria-expanded="false">More settings ▾</button>
    <div class="collapsible">
      <label class="field" for="range">Axis range (±) <output id="range-out">10</output></label>
      <input type="range" id="range" min="2" max="50" step="1" value="10">
      <div id="opacity-wrap">
        <label class="field" for="opacity">Surface opacity <output id="opacity-out">0.80</output></label>
        <input type="range" id="opacity" min="0.2" max="1" step="0.05" value="0.8">
      </div>
      <label class="toggle"><input type="checkbox" id="extra" checked> <span id="extra-label">Show coloured X / Y / Z axes</span></label>
    </div>
  </aside>

  <main>
    <section class="hero">
      <h1>📐 <span>Coordinate Studio</span></h1>
      <p>Type in the box below. Everything you type is drawn on the graph and explained in simple English.</p>
    </section>

    <label class="input-label" for="text"><span>Type here — one thing per line</span>
      <span class="status" id="status"></span></label>
    <textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="Type here, one thing per line"></textarea>
    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="content">
      <section>
        <div id="plot" role="img" aria-label="Graph"></div>
        <p class="hint" id="plot-hint"></p>
      </section>
      <section>
        <h3>💬 Explanation</h3>
        <div id="explanation"></div>
      </section>
    </div>
  </main>
</div>

<script id="config" type="application/json">__CONFIG__</script>
<script>
(() => {
  const CONFIG = JSON.parse(document.getElementById("config").textContent);
  const $ = (id) => document.getElementById(id);
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage unavailable */ } },
  };

  const state = { mode: store.get("cs-mode") === "2d" ? "2d" : "3d", seq: 0, controller: null };
  const text = $("text");
  // Saved text from before the explanations existed is not reused, so everyone first sees the axes explained.
  const TEXT_KEY = "cs-text-v2";
  text.maxLength = CONFIG.maxChars;

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "style") node.style.cssText = v; else if (k === "class") node.className = v; else node.setAttribute(k, v);
    }
    for (const child of children) node.append(child);
    return node;
  }

  // ------------------------------------------------------------------ controls

  function setMode(mode) {
    state.mode = mode;
    store.set("cs-mode", mode);
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    $("opacity-wrap").style.display = mode === "3d" ? "" : "none";
    $("extra-label").textContent = mode === "3d" ? "Show coloured X / Y / Z axes" : "Show grid";
    $("range").value = mode === "3d" ? 10 : 8;
    $("range-out").textContent = $("range").value;
    $("plot-hint").textContent = mode === "3d"
      ? "X → right · Y ↑ up · Z ↙ towards you  ·  🖱️ Drag to rotate · scroll or pinch to zoom · double-click to reset"
      : "🖱️ Drag to pan · scroll or pinch to zoom · double-click to reset";
    text.value = store.get(`${TEXT_KEY}-${mode}`) ?? CONFIG.startingText[mode];
    if (window.Plotly) Plotly.purge($("plot"));
    compute();
  }

  // ------------------------------------------------------------------ rendering

  function renderMessages(data) {
    $("messages").replaceChildren(
      ...data.errors.map((m) => el("div", { class: "msg error" }, "⚠️ " + m)),
      ...data.warnings.map((m) => el("div", { class: "msg warning" }, "ℹ️ " + m)),
    );
  }

  function renderExplanation(data) {
    const nodes = data.explanations.map((c) => el("div", { class: "card" },
      el("h4", { style: `color:${c.color}` }, c.label, el("span", { class: "chip", style: `background:${c.color}` }, c.kind)),
      ...c.sentences.map((s) => el("p", { class: "sentence" }, s)),
    ));
    if (data.measurements.length) {
      nodes.push(el("div", { class: "card" }, el("h4", {}, "📏 Measurements"),
        ...data.measurements.map((s) => el("p", { class: "sentence" }, s))));
    }
    if (!nodes.length) nodes.push(el("p", { class: "empty" }, "Type something in the box to see it explained here."));
    $("explanation").replaceChildren(...nodes);
  }

  function renderPlot(figure) {
    const plot = $("plot");
    if (!figure || !window.Plotly) return;
    const layout = { ...figure.layout, height: plot.clientHeight, autosize: true };
    if (window.innerWidth < 860) layout.legend = { ...layout.legend, font: { size: 10 } };
    Plotly.react(plot, figure.data, layout, { displaylogo: false, scrollZoom: true, responsive: true });
  }

  // ------------------------------------------------------------------ server

  async function compute() {
    const seq = ++state.seq;
    state.controller?.abort();
    state.controller = new AbortController();
    $("status").textContent = "Calculating…";
    store.set(`${TEXT_KEY}-${state.mode}`, text.value);
    try {
      const response = await fetch("/api/compute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: state.controller.signal,
        body: JSON.stringify({
          text: text.value, mode: state.mode, range: +$("range").value, opacity: +$("opacity").value,
          showExtra: $("extra").checked,
        }),
      });
      if (!response.ok) throw new Error(`Server error ${response.status}`);
      const data = await response.json();
      if (seq !== state.seq) return;

      renderMessages(data);
      renderExplanation(data);
      renderPlot(data.figure);
      $("status").textContent = "";
    } catch (err) {
      if (err.name === "AbortError") return;
      $("status").textContent = "";
      $("messages").replaceChildren(el("div", { class: "msg error" },
        "⚠️ Could not reach the server — check your connection and try again."));
    }
  }

  let timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(compute, 350); }

  // ------------------------------------------------------------------ wiring

  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.mode !== state.mode) setMode(b.dataset.mode);
  }));
  text.addEventListener("input", schedule);
  $("range").addEventListener("input", () => { $("range-out").textContent = $("range").value; schedule(); });
  $("opacity").addEventListener("input", () => { $("opacity-out").textContent = (+$("opacity").value).toFixed(2); schedule(); });
  $("extra").addEventListener("change", compute);
  $("menu").addEventListener("click", () => {
    const open = $("sidebar").classList.toggle("open");
    $("menu").setAttribute("aria-expanded", String(open));
    $("menu").textContent = open ? "Fewer settings ▴" : "More settings ▾";
  });
  window.addEventListener("resize", () => { if (window.Plotly) Plotly.Plots.resize($("plot")); });

  // The libraries load with "defer", so start once everything is ready.
  window.addEventListener("DOMContentLoaded", () => setMode(state.mode));
})();
</script>
</body>
</html>
